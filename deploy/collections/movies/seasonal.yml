collections:
  Seasonal Collections:
    template:
      - name: separator
        separator: seasonal
        use_separator: false
        key_name: Seasonal
        translation_key: separator
  🎅 Christmas Movies:
    sort_title: "!00_Christmas Movies"
    schedule: range(11/01-01/10)
    delete_not_scheduled: true
    sync_mode: sync
    collection_order: custom
    visible_home: true
    visible_shared: true
    radarr_add_missing: true
    summary: Christmas film is a genre that revolves around the plot involving Christmas.
    letterboxd_list:
      - https://letterboxd.com/ryukiation/list/christmas/
    text_file: /config/movies/generated/christmas-1.txt
    url_poster: https://raw.githubusercontent.com/Kometa-Team/Default-Images/master/seasonal/christmas.jpg

metadata:
  🎅 Christmas Movies:
    content_rating: G


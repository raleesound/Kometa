# Keeps this fork's `nightly` in step with Kometa-Team/Kometa `nightly`.
#
# Upstream runs ~266 commits a quarter. Letting the fork drift is what turned a
# latent config break into a five-week surprise during the 2026-08-22 cutover, so
# the merge happens nightly and small rather than rarely and large.
#
# The merge is gated on the full test suite running here, not on branch
# protection, so a green run means the tests actually passed rather than that no
# checks were configured. A conflict or a failure opens an issue and stops; it
# never leaves a half-merged branch behind.
#
# Nothing here deploys. The media host pins an explicit SHA in KOMETA_REF, so
# upstream code reaches Plex only when someone bumps that and runs deploy.sh.

name: Upstream Sync

on:
  schedule:
    # 05:20 UTC — after upstream's own nightly build, and outside the media
    # host's Kometa run windows.
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: https://github.com/Kometa-Team/Kometa.git
  BRANCH: nightly
  # Matches PYTHON_VERSION in test.yml so the gate runs on the same interpreter CI does.
  PYTHON_VERSION: "3.12"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        id: fetch
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$BRANCH"
          behind=$(git rev-list --count HEAD..upstream/$BRANCH)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Behind upstream/$BRANCH by $behind commit(s)."

      - name: Merge upstream
        id: merge
        if: steps.fetch.outputs.behind != '0'
        run: |
          git config user.name "kometa-sync[bot]"
          git config user.email "kometa-sync[bot]@users.noreply.github.com"
          if git merge --no-edit upstream/$BRANCH; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            # Leave nothing half-merged for the next run to trip over.
            git merge --abort || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.merge.outputs.conflict == 'false'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Test the merge result
        id: tests
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt -r dev-requirements.txt pytest
          python -m pytest tests/ -q

      - name: Push
        if: steps.merge.outputs.conflict == 'false' && steps.tests.outcome == 'success'
        run: |
          git push origin HEAD:$BRANCH
          echo "Merged $(git rev-list --count HEAD@{1}..HEAD) upstream commit(s) into $BRANCH."

      - name: Report a sync that needs a human
        if: steps.merge.outputs.conflict == 'true' || (steps.tests.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const conflict = '${{ steps.merge.outputs.conflict }}' === 'true';
            const behind = '${{ steps.fetch.outputs.behind }}';
            const title = conflict
              ? `Upstream sync: merge conflict against ${process.env.BRANCH}`
              : `Upstream sync: tests fail after merging ${process.env.BRANCH}`;
            const body = [
              conflict
                ? `Merging \`upstream/${process.env.BRANCH}\` conflicts with our diff. The merge was aborted; the branch is untouched.`
                : `\`upstream/${process.env.BRANCH}\` merges cleanly but the test suite fails on the result. Nothing was pushed.`,
              ``,
              `Behind upstream by **${behind}** commit(s).`,
              ``,
              `Resolve locally:`,
              '```',
              `git fetch upstream ${process.env.BRANCH}`,
              `git checkout ${process.env.BRANCH}`,
              `git merge upstream/${process.env.BRANCH}`,
              '```',
              ``,
              `[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync',
            });
            // One open issue per failure mode; a nightly job must not file a new
            // one every night for the same stuck merge.
            const match = existing.data.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number,
                body: `Still stuck as of ${new Date().toISOString().slice(0, 10)} — behind by ${behind} commit(s).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-sync'],
              });
            }
